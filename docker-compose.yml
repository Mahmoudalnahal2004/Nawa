version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: nawa-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: nawa
      POSTGRES_PASSWORD: nawa_secret_2026
      POSTGRES_DB: nawa_qbank
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nawa -d nawa_qbank"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
    driver: local
